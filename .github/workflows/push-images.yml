name: Push images to Docker Hub

on:
  push:
    branches:
      - master
    paths:
      - 'circleci/**/Dockerfile*'
  workflow_dispatch:
    inputs:
      dockerfiles:
        description: 'Dockerfile paths (space separated), e.g. circleci/ruby/4.0.8/Dockerfile.amazonlinux2023'
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DOCKERFILES: ${{ inputs.dockerfiles }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            files=$(echo "$INPUT_DOCKERFILES" | tr ' ' '\n')
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'circleci/**/Dockerfile*')
          fi
          # circleci/<lang>/<version>/Dockerfile[.<variant>] -> fromscratch/<lang>:<version>[-<variant>]
          entries=()
          for f in $files; do
            [ -z "$f" ] && continue
            if [[ ! "$f" =~ ^circleci/([^/]+)/([^/]+)/Dockerfile(\.(.+))?$ ]] || [ ! -f "$f" ]; then
              echo "::warning::skip $f (path does not match the naming rule or file not found)"
              continue
            fi
            tag="${BASH_REMATCH[2]}${BASH_REMATCH[4]:+-${BASH_REMATCH[4]}}"
            entries+=("$(jq -nc --arg file "$f" --arg context "$(dirname "$f")" --arg image "fromscratch/${BASH_REMATCH[1]}:$tag" '{file: $file, context: $context, image: $image}')")
          done
          echo "matrix=$(printf '%s\n' "${entries[@]}" | jq -sc '{include: .}')" >> "$GITHUB_OUTPUT"

  push:
    needs: plan
    if: fromJSON(needs.plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Fail if the tag already exists
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::error::$IMAGE already exists. Use a new tag instead of overwriting."
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}
